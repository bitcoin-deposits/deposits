# Tufte-Jekyll Configuration
title: "Bitcoin Deposits Protocol"
email: ynniv@ynniv.com
description: > # this means to ignore newlines until "baseurl:"
  Bitcoin Deposits: A Layer 2 Scaling Protocol

baseurl: "/" # the subpath of your site, e.g. /blog
url: "https://bitcoindeposits.net" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
highlighter: rouge

# Kramdown settings
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - theme.md
  - README.md
